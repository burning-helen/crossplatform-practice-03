<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'"
  >

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Файловый обозреватель</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="app">
    <header class="header">
      <p class="subtitle">Практическая работа № 3 · Electron</p>
      <h1>Файловый обозреватель</h1>

      <p class="student">
        Бурняшева Елена Александровна · ТРПО23-1 · Вариант 4
      </p>
    </header>

    <section class="panel" aria-labelledby="directory-heading">
      <h2 id="directory-heading">Содержимое каталога</h2>

      <p class="description">
        Просмотр файлов и папок рабочего каталога приложения.
      </p>

      <button id="show-directory" type="button">
        Показать содержимое каталога
      </button>

      <p id="status" class="status" role="status">
        Нажмите кнопку, чтобы показать файлы и папки рабочего каталога.
      </p>

      <ul
        id="file-list"
        class="file-list"
        aria-label="Файлы и папки"
      ></ul>
    </section>
  </main>
    <script src="renderer.js"></script>
</body>
</html>
